<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>2048</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body { margin:0; padding:0; width:100%; min-height:100%; background:#faf8ef; font-family:Arial,Helvetica,sans-serif; color:#776e65; transition:background-color 180ms ease,color 180ms ease; }
body.dark-mode { background:#20211f; color:#e1ded7; }
body.dark-mode .score-box { background:#454640; color:#f2f0e9; }
body.dark-mode #board { background:#454640; }
body.dark-mode .grid-cell { background:#30312e; }
body.dark-mode button { background:#565750; color:#f2f0e9; }
body.dark-mode .tile.n2 { background:#4a4943; color:#f0eee7; }
body.dark-mode .tile.n4 { background:#625b4d; color:#f5f0e6; }
body.dark-mode .tile.n8 { background:#a77b52; color:#fffaf2; }
body.dark-mode .tile.n16 { background:#ae6c4d; color:#fffaf2; }
body.dark-mode .tile.n32 { background:#ad5e4b; color:#fffaf2; }
body.dark-mode .tile.n64 { background:#a44d3d; color:#fffaf2; }
body.dark-mode .tile.n128 { background:#9c8750; color:#fffaf2; }
body.dark-mode .tile.n256 { background:#9c8345; color:#fffaf2; }
body.dark-mode .tile.n512 { background:#92783d; color:#fffaf2; }
body.dark-mode .tile.n1024 { background:#866c35; color:#fffaf2; }
body.dark-mode .tile.n2048 { background:#79602e; color:#fffaf2; }
body.dark-mode #message { color:#e1ded7; }

body {
  display: flex;
  justify-content: center;

  overflow-x: hidden;
}

.game {
  width: min(94vw, 500px);

  padding-top: 20px;
  padding-bottom: 35px;
}


/* =========================
   ヘッダー
========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 10px;
}


/* ここを5回タップ */

#secretButton {
  margin: 0;

  font-size: 70px;
  line-height: 1;

  font-weight: 800;

  cursor: default;
}


/* =========================
   スコア
========================= */

.scores {
  display: flex;
  gap: 8px;
}

.score-box {
  min-width: 85px;

  padding: 7px 14px;

  background: #bbada0;
  color: white;

  border-radius: 5px;

  text-align: center;
}

.score-title {
  font-size: 12px;
  font-weight: bold;
}

.score-value {
  font-size: 25px;
  line-height: 30px;
  font-weight: bold;
}


/* =========================
   説明
========================= */

.info {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 10px;

  margin-bottom: 12px;
}

.info-text {
  font-size: 16px;
}

button {
  border: none;

  border-radius: 5px;

  padding: 10px 14px;

  background: #8f7a66;
  color: white;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

button:active {
  transform: scale(.97);
}


/* =========================
   隠し暗証番号入力
========================= */

/*
 * 普段は完全に見えない。
 * 5回タップされたときだけ
 * JavaScriptからfocusする。
 */

#secretInput {
  position: fixed;

  left: -10000px;
  top: -10000px;

  width: 1px;
  height: 1px;

  opacity: 0;

  border: 0;

  pointer-events: none;
}


/* =========================
   ゲーム盤
========================= */

#board {
  position: relative;

  width: 100%;
  aspect-ratio: 1 / 1;

  background: #bbada0;

  border-radius: 8px;

  overflow: hidden;

  touch-action: none;
}

.board-inner {
  position: absolute;

  top: 10px;
  left: 10px;
  right: 10px;
  bottom: 10px;
}


/* =========================
   背景マス
========================= */

.grid {
  position: absolute;

  inset: 0;

  display: grid;

  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);

  gap: 10px;
}

.grid-cell {
  background: #cdc1b4;

  border-radius: 5px;
}


/* =========================
   タイルレイヤー
========================= */

.tile-layer {
  position: absolute;

  inset: 0;

  pointer-events: none;
}


/* =========================
   タイル
========================= */

.tile {
  position: absolute;

  width: calc((100% - 30px) / 4);
  height: calc((100% - 30px) / 4);

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 5px;

  /* 立体感なし */
  box-shadow: none;

  /*
   * タイルそのものを移動
   */
  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    );

  transition:
    transform 135ms ease-in-out;

  will-change: transform;

  font-size:
    clamp(
      32px,
      9vw,
      52px
    );

  font-weight: bold;

  z-index: 2;

  pointer-events: auto;
}


/* =========================
   新しいタイル
========================= */

.tile.new {
  animation:
    tileAppear 110ms ease-out;
}

@keyframes tileAppear {

  0% {
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      scale(.5);
  }

  100% {
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      scale(1);
  }

}


/* =========================
   合体
========================= */

.tile.merge {
  animation:
    tileMerge 120ms ease-out;
}

@keyframes tileMerge {

  0% {
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      scale(1);
  }

  50% {
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      scale(1.12);
  }

  100% {
    transform:
      translate3d(
        var(--x),
        var(--y),
        0
      )
      scale(1);
  }

}


/* =========================
   タイルカラー
========================= */

.n2 {
  background: #eee4da;
  color: #776e65;
}

.n4 {
  background: #ede0c8;
  color: #776e65;
}

.n8 {
  background: #f2b179;
  color: white;
}

.n16 {
  background: #f59563;
  color: white;
}

.n32 {
  background: #f67c5f;
  color: white;
}

.n64 {
  background: #f65e3b;
  color: white;
}

.n128 {
  background: #edcf72;
  color: white;
  font-size: 42px;
}

.n256 {
  background: #edcc61;
  color: white;
  font-size: 42px;
}

.n512 {
  background: #edc850;
  color: white;
  font-size: 42px;
}

.n1024 {
  background: #edc53f;
  color: white;
  font-size: 38px;
}

.n2048 {
  background: #edc22e;
  color: white;
  font-size: 38px;
}


/* =========================
   GAME OVER
========================= */

#message {
  min-height: 30px;

  margin-top: 15px;

  text-align: center;

  font-size: 24px;

  font-weight: bold;
}


/* モード切り替え時も操作列の幅を保ち、文字のはみ出しを防ぐ */
.mode-controls {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: -4px 0 12px;
}

.mode-controls label {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

.mode-controls select {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  padding: 10px 30px 10px 10px;
  border: 0;
  border-radius: 5px;
  background: #bbada0;
  color: white;
  font: inherit;
  font-size: 13px;
  font-weight: bold;
  text-overflow: ellipsis;
}

.mode-controls button {
  min-width: 0;
  white-space: nowrap;
}

@media (max-width: 520px) {
  .game { width: min(94vw, 500px); }
  .mode-controls {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
  }
  .mode-controls label { grid-column: 1; align-self: end; }
  .mode-controls select { grid-column: 2; }
  .mode-controls button { width: 100%; padding: 10px 8px; }
}

@media (max-width: 360px) {
  .mode-controls {
    grid-template-columns: minmax(0, 1fr);
  }
  .mode-controls label,
  .mode-controls select { grid-column: 1; }
  .mode-controls label { margin-bottom: -4px; }
  .mode-controls button { grid-column: 1; }
}

/* =========================
   小さい画面
========================= */

@media (max-width: 400px) {

  .game {
    width: 94vw;
  }

  #secretButton {
    font-size: 55px;
  }

  .score-box {
    min-width: 75px;
    padding: 6px 8px;
  }

  .score-value {
    font-size: 21px;
  }

  .info-text {
    font-size: 12px;
  }

  button {
    padding: 9px 10px;
  }

}


/* =========================
   iPad
========================= */

@media (min-width: 401px) and (max-width: 900px) {

  .game {
    width: min(80vw, 600px);
  }

}

</style>
</head>


<body>

<div class="game">


  <!-- =====================
       HEADER
  ====================== -->

  <div class="header">

    <!--
      ここを5回タップすると
      暗証番号入力を開始
    -->

    <h1 id="secretButton">
      2048
    </h1>


    <div class="scores">

      <div class="score-box">

        <div class="score-title">
          SCORE
        </div>

        <div
          id="score"
          class="score-value">
          0
        </div>

      </div>


      <div class="score-box">

        <div class="score-title">
          BEST
        </div>

        <div
          id="best"
          class="score-value">
          0
        </div>

      </div>

    </div>

  </div>


  <div class="info" style="flex-wrap:wrap;">
    <span class="info-text">矢印キー / WASD・スワイプで操作</span>
    <button id="newGameButton" type="button">新しいゲーム</button>
  </div>
  <div class="mode-controls" aria-label="ゲーム操作">
    <label for="modeSelect">モード</label>
    <select id="modeSelect" aria-label="ゲームモード">
      <option value="standard">スタンダード（1手戻すあり）</option>
      <option value="hardcore">ハードコア（巻き戻しなし）</option>
    </select>
    <button id="undoButton" type="button" disabled>↶ 1手戻す</button>
    <button id="themeButton" type="button" aria-pressed="false">☾ ダーク</button>
  </div>


  <!-- =====================
       隠し入力
  ====================== -->

  <input
    id="secretInput"
    type="tel"
    inputmode="numeric"
    autocomplete="off"
    maxlength="4"
    tabindex="-1"
  >


  <!-- =====================
       BOARD
  ====================== -->

  <div id="board">

    <div class="board-inner">

      <div class="grid">

        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>

        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>

        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>

        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>

      </div>


      <div
        id="tileLayer"
        class="tile-layer">
      </div>

    </div>

  </div>


  <div id="message"></div>

</div>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {


    /* =========================
       DOM
    ========================= */

    const board =
      document.getElementById(
        "board"
      );

    const tileLayer =
      document.getElementById(
        "tileLayer"
      );

    const scoreElement =
      document.getElementById(
        "score"
      );

    const bestElement =
      document.getElementById(
        "best"
      );

    const messageElement =
      document.getElementById(
        "message"
      );

    const newGameButton = document.getElementById("newGameButton");
    const modeSelect = document.getElementById("modeSelect");
    const undoButton = document.getElementById("undoButton");
    const themeButton = document.getElementById("themeButton");

    const secretButton =
      document.getElementById(
        "secretButton"
      );

    const secretInput =
      document.getElementById(
        "secretInput"
      );


    /* =========================
       設定
    ========================= */

    const SIZE = 4;

    const MOVE_TIME = 135;

    /*
     * 正しい暗証番号
     */

    const SECRET_CODE = "0812";


    /*
     * 1ゲームで使える削除回数
     */

    const MAX_DELETE_USES = 2;


    /*
     * 現在のゲームを保存するキー。
     * BESTスコア用の「2048-best」とは分けて管理する。
     */
    const CURRENT_GAME_KEY = "2048-current-game";


    /*
     * タイトルの必要タップ回数
     */

    const SECRET_TAPS = 5;


    /* =========================
       GAME STATE
    ========================= */

    let boardData =
      createEmptyBoard();

    let score = 0;
    let gameMode = "standard";
    let undoSnapshot = null;
    let darkMode = false;


    /*
     * 最高スコア
     *
     * ブラウザのlocalStorageに保存
     */

    let best =
      Number(
        localStorage.getItem(
          "2048-best"
        )
      ) || 0;


    /*
     * 移動キュー
     */

    let moveQueue = [];


    /*
     * 移動中か
     */

    let moving = false;


    /*
     * 削除モード
     */

    let deleteMode = false;


    /*
     * このゲームで使った削除回数
     */

    let deleteUses = 0;


    /*
     * タイトルを何回タップしたか
     */

    let secretTapCount = 0;


    /*
     * タイトル連続タップのタイマー
     */

    let secretTapTimer = null;


    /* =========================
       セーブ / ロード
    ========================= */

    function saveCurrentGame() {
      try {
        const state = {
          version: 2,
          board: boardData.map(function (row) { return row.map(function (tile) { return tile ? tile.value : null; }); }),
          score: score,
          deleteUses: deleteUses,
          gameOver: messageElement.textContent === "GAME OVER",
          gameMode: gameMode,
          undoSnapshot: undoSnapshot
        };

        localStorage.setItem(
          CURRENT_GAME_KEY,
          JSON.stringify(state)
        );
      } catch (error) {
        /* 保存容量不足や保存禁止でもゲーム自体は続ける */
      }
    }


    function loadCurrentGame() {

      let state;

      try {
        const saved = localStorage.getItem(CURRENT_GAME_KEY);
        if (!saved) return false;
        state = JSON.parse(saved);
      } catch (error) {
        return false;
      }

      /* 保存データが壊れていたり、想定外の形式なら復元しない */
      if (
        !state ||
        (state.version !== 1 && state.version !== 2) ||
        !Array.isArray(state.board) ||
        state.board.length !== SIZE ||
        !Number.isSafeInteger(state.score) ||
        state.score < 0 ||
        (state.version === 2 && state.gameMode !== "standard" && state.gameMode !== "hardcore") ||
        !Number.isInteger(state.deleteUses) ||
        state.deleteUses < 0 ||
        state.deleteUses > MAX_DELETE_USES ||
        typeof state.gameOver !== "boolean"
      ) {
        return false;
      }

      for (const row of state.board) {
        if (!Array.isArray(row) || row.length !== SIZE) {
          return false;
        }
        for (const value of row) {
          if (
            value !== null &&
            (!Number.isSafeInteger(value) || value < 2 || !Number.isInteger(Math.log2(value)))
          ) {
            return false;
          }
        }
      }

      boardData = createEmptyBoard();
      tileLayer.innerHTML = "";
      score = state.score;
      deleteUses = state.deleteUses;
      gameMode = state.version === 2 ? state.gameMode : "standard";
      modeSelect.value = gameMode;
      undoSnapshot = state.version === 2 && state.undoSnapshot && gameMode === "standard" ? state.undoSnapshot : null;
      deleteMode = false;
      moveQueue = [];
      moving = false;
      messageElement.textContent = state.gameOver ? "GAME OVER" : "";

      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
          const value = state.board[row][col];
          if (value === null) continue;

          boardData[row][col] = {
            value: value,
            element: createTileElement(value, row, col, false)
          };
        }
      }

      updateScore();
      updateUndoButton();
      return true;
    }


    function updateUndoButton() {
      undoButton.disabled = gameMode !== "standard" || !undoSnapshot || moving;
      undoButton.style.opacity = undoButton.disabled ? "0.48" : "1";
      undoButton.title = gameMode === "hardcore" ? "ハードコアでは巻き戻せません" : "直前の盤面に戻します";
    }


    function restoreSnapshot(snapshot) {
      if (!snapshot || !Array.isArray(snapshot.board) || snapshot.board.length !== SIZE) return false;
      for (const row of snapshot.board) {
        if (!Array.isArray(row) || row.length !== SIZE) return false;
        for (const value of row) {
          if (value !== null && (!Number.isSafeInteger(value) || value < 2 || !Number.isInteger(Math.log2(value)))) return false;
        }
      }
      if (!Number.isSafeInteger(snapshot.score) || snapshot.score < 0 || !Number.isInteger(snapshot.deleteUses) || snapshot.deleteUses < 0 || snapshot.deleteUses > MAX_DELETE_USES) return false;
      boardData = createEmptyBoard();
      tileLayer.innerHTML = "";
      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
          const value = snapshot.board[row][col];
          if (value !== null) boardData[row][col] = { value: value, element: createTileElement(value, row, col, false) };
        }
      }
      score = snapshot.score;
      deleteUses = snapshot.deleteUses;
      messageElement.textContent = snapshot.gameOver ? "GAME OVER" : "";
      updateScore();
      return true;
    }


    /* =========================
       タイトル5回タップ
    ========================= */

    secretButton.addEventListener(
      "click",
      function () {


        /*
         * タップ回数を増やす
         */

        secretTapCount++;


        /*
         * 一定時間タップされなければ
         * カウントをリセット
         */

        clearTimeout(
          secretTapTimer
        );


        secretTapTimer =
          setTimeout(
            function () {

              secretTapCount = 0;

            },
            1200
          );


        /*
         * 5回タップ
         */

        if (
          secretTapCount >=
          SECRET_TAPS
        ) {


          /*
           * 既に2回使い切っているなら
           * 入力画面を出さない
           */

          if (
            deleteUses >=
            MAX_DELETE_USES
          ) {

            secretTapCount = 0;

            clearTimeout(
              secretTapTimer
            );

            return;

          }


          /*
           * 暗証番号入力欄を空にする
           */

          secretInput.value = "";


          /*
           * 入力欄にフォーカス
           *
           * 見た目は完全に透明
           */

          secretInput.focus();


          /*
           * タップカウントをリセット
           */

          secretTapCount = 0;

          clearTimeout(
            secretTapTimer
          );

        }

      }
    );


    /* =========================
       暗証番号入力
    ========================= */

    secretInput.addEventListener(
      "input",
      function () {


        /*
         * 数字以外を除去
         */

        secretInput.value =
          secretInput.value
            .replace(
              /[^0-9]/g,
              ""
            );


        /*
         * 4桁入力されたら判定
         */

        if (
          secretInput.value.length ===
          4
        ) {


          /*
           * 正しい暗証番号
           */

          if (
            secretInput.value ===
            SECRET_CODE
          ) {


            /*
             * 2回未満なら
             * 削除モードON
             */

            if (
              deleteUses <
              MAX_DELETE_USES
            ) {

              deleteMode = true;

            }

          }


          /*
           * 間違っていても
           * 何も画面に表示しない
           */

          secretInput.value = "";


          /*
           * キーボードを閉じる
           */

          secretInput.blur();

        }

      }
    );


    /* =========================
       空の盤面
    ========================= */

    function createEmptyBoard() {

      return [

        [null, null, null, null],

        [null, null, null, null],

        [null, null, null, null],

        [null, null, null, null]

      ];

    }


    /* =========================
       タイルサイズ
    ========================= */
    function getCellSize() {

      return (
        tileLayer.clientWidth - 30
      ) / 4;

    }


    /* =========================
       タイル座標
    ========================= */

    function getPosition(
      row,
      col
    ) {

      const size =
        getCellSize();


      return {

        x:
          col *
          (size + 10),

        y:
          row *
          (size + 10)

      };

    }


    /* =========================
       タイル作成
    ========================= */

    function createTileElement(
      value,
      row,
      col,
      isNew
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "tile n" + value;


      element.textContent =
        value;


      const position =
        getPosition(
          row,
          col
        );


      element.style.setProperty(
        "--x",
        position.x + "px"
      );

      element.style.setProperty(
        "--y",
        position.y + "px"
      );


      element.style.transform =
        `translate3d(
          ${position.x}px,
          ${position.y}px,
          0
        )`;


      tileLayer.appendChild(
        element
      );


      /* =====================
         タイルクリック
      ===================== */

      element.addEventListener(
        "click",
        function () {


          /*
           * 削除モードでなければ
           * 普通のクリック
           */

          if (!deleteMode) {
            return;
          }


          /*
           * 移動中は削除しない
           */

          if (moving) {
            return;
          }


          /*
           * 既に2回使っていたら
           * 削除不可
           */

          if (
            deleteUses >=
            MAX_DELETE_USES
          ) {

            deleteMode = false;

            return;

          }


          /*
           * クリックされたタイルを探す
           */

          for (
            let r = 0;
            r < SIZE;
            r++
          ) {

            for (
              let c = 0;
              c < SIZE;
              c++
            ) {

              const tile =
                boardData[r][c];


              if (
                tile &&
                tile.element ===
                  element
              ) {


                /*
                 * 盤面から削除
                 */

                boardData[r][c] =
                  null;


                /*
                 * 画面から削除
                 */

                element.remove();


                /*
                 * ★使用回数を増やす
                 */

                deleteUses++;


                /*
                 * 削除モード終了
                 */

                deleteMode = false;

                saveCurrentGame();

                return;

              }

            }

          }

        }
      );


      /* =====================
         新規タイルアニメーション
      ===================== */

      if (isNew) {

        element.classList.add(
          "new"
        );


        setTimeout(
          function () {

            element.classList.remove(
              "new"
            );

          },
          120
        );

      }


      return element;

    }


    /* =========================
       タイル移動
    ========================= */

    function moveElement(
      tile,
      row,
      col
    ) {

      const position =
        getPosition(
          row,
          col
        );


      tile.element.style.setProperty(
        "--x",
        position.x + "px"
      );

      tile.element.style.setProperty(
        "--y",
        position.y + "px"
      );


      /*
       * タイルそのものが
       * スライドする
       */

      tile.element.style.transform =
        `translate3d(
          ${position.x}px,
          ${position.y}px,
          0
        )`;

    }


    /* =========================
       新しい2 / 4
    ========================= */

    function addRandomTile() {

      const empty = [];


      for (
        let row = 0;
        row < SIZE;
        row++
      ) {

        for (
          let col = 0;
          col < SIZE;
          col++
        ) {

          if (
            boardData[row][col] ===
            null
          ) {

            empty.push([
              row,
              col
            ]);

          }

        }

      }


      if (
        empty.length === 0
      ) {

        return;

      }


      const index =
        Math.floor(
          Math.random() *
          empty.length
        );


      const row =
        empty[index][0];

      const col =
        empty[index][1];


      const value =
        Math.random() < 0.9
          ? 2
          : 4;


      const tile = {

        value: value,

        element:
          createTileElement(
            value,
            row,
            col,
            true
          )

      };


      boardData[row][col] =
        tile;

    }


    /* =========================
       スコア
    ========================= */

    function updateScore() {

      scoreElement.textContent =
        score;


      /*
       * BEST更新
       */

      if (
        score > best
      ) {

        best = score;


        /*
         * ブラウザに保存
         */

        localStorage.setItem(
          "2048-best",
          String(best)
        );

      }


      bestElement.textContent =
        best;

    }


    /* =========================
       新しいゲーム
    ========================= */

    function newGame() {


      /*
       * 移動キューを空にする
       */

      moveQueue = [];


      /*
       * 移動状態リセット
       */

      moving = false;


      /*
       * 削除モードOFF
       */

      deleteMode = false;


      /*
       * 削除回数リセット
       *
       * ★新しいゲームなので
       * ★また2回使える
       */

      deleteUses = 0;


      /*
       * 暗証番号入力リセット
       */

      secretInput.value = "";


      secretTapCount = 0;


      clearTimeout(
        secretTapTimer
      );


      /*
       * スコアリセット
       */

      score = 0;
      undoSnapshot = null;


      /*
       * 盤面リセット
       */

      boardData =
        createEmptyBoard();


      /*
       * タイル全削除
       */

      tileLayer.innerHTML =
        "";


      /*
       * GAME OVER解除
       */

      messageElement.textContent =
        "";


      /*
       * 最初の2個
       */

      addRandomTile();

      addRandomTile();


      /*
       * スコア表示と新しい盤面の保存
       */

      updateScore();
      updateUndoButton();
      saveCurrentGame();

    }


    /* =========================
       移動要求
    ========================= */

    function requestMove(
      direction
    ) {


      /*
       * GAME OVER
       */

      if (
        messageElement.textContent
      ) {

        return;

      }


      /*
       * 削除モード中は
       * スワイプ移動しない
       */

      if (deleteMode) {

        return;

      }


      /*
       * 移動をキューに入れる
       */

      moveQueue.push(
        direction
      );


      /*
       * キューが増えすぎないようにする
       */

      if (moveQueue.length > 4) {

        moveQueue.shift();

      }


      processQueue();

    }


    /* =========================
       移動キュー
    ========================= */

    function processQueue() {

      if (moving) {
        return;
      }


      if (
        moveQueue.length === 0
      ) {

        return;

      }


      const direction =
        moveQueue.shift();


      performMove(
        direction
      );

    }


    /* =========================
       実際の移動
    ========================= */

    function performMove(
      direction
    ) {

      const oldBoard = boardData;
      const scoreBeforeMove = score;

      const newBoard =
        createEmptyBoard();


      const movingTiles = [];


      let changed = false;


      let rows =
        [0, 1, 2, 3];

      let cols =
        [0, 1, 2, 3];


      if (
        direction === "right"
      ) {

        cols =
          [3, 2, 1, 0];

      }


      if (
        direction === "down"
      ) {

        rows =
          [3, 2, 1, 0];

      }


      /* =====================
         左右
      ===================== */

      if (

        direction === "left" ||
        direction === "right"

      ) {

        for (
          const row of rows
        ) {

          const line = [];


          for (
            const col of cols
          ) {

            const tile =
              oldBoard[row][col];


            if (tile) {

              line.push({

                tile: tile,

                oldRow: row,

                oldCol: col

              });

            }

          }


          processLine(
            line,
            direction,
            newBoard,
            movingTiles
          );

        }

      }


      /* =====================
         上下
      ===================== */

      else {

        for (
          const col of cols
        ) {

          const line = [];


          for (
            const row of rows
          ) {

            const tile =
              oldBoard[row][col];


            if (tile) {

              line.push({

                tile: tile,

                oldRow: row,

                oldCol: col

              });

            }

          }


          processLine(
            line,
            direction,
            newBoard,
            movingTiles
          );

        }

      }


      /* =====================
         移動したか確認
      ===================== */

      for (
        const item of movingTiles
      ) {

        if (

          item.oldRow !==
            item.newRow ||

          item.oldCol !==
            item.newCol ||

          item.removed

        ) {

          changed = true;

          break;

        }

      }


      /*
       * 何も変わっていない
       */

      if (!changed) {

        processQueue();

        return;

      }


      /*
       * スタンダードのみ、移動前の盤面を1手分保存
       */
      if (gameMode === "standard") {
        undoSnapshot = {
          board: oldBoard.map(function (row) { return row.map(function (tile) { return tile ? tile.value : null; }); }),
          score: scoreBeforeMove,
          deleteUses: deleteUses,
          gameOver: false
        };
      }

      /*
       * 盤面更新
       */
      boardData =
        newBoard;


      /*
       * アニメーション開始
       */

      moving = true;


      /*
       * 全タイルを移動
       */

      for (
        const item of movingTiles
      ) {

        moveElement(
          item.tile,
          item.newRow,
          item.newCol
        );

      }


      updateScore();
      updateUndoButton();


      /* =====================
         アニメーション終了
      ===================== */

      setTimeout(
        function () {


          /*
           * 合体で消えるタイル
           */

          for (
            const item of movingTiles
          ) {

            if (
              item.removed
            ) {

              item.tile.element.remove();

            }

          }


          /*
           * 合体したタイル
           */

          for (
            const item of movingTiles
          ) {

            if (
              item.mergedInto
            ) {

              const target =
                item.mergedInto;


              target.element.textContent =
                target.value;


              target.element.className =
                "tile n" +
                target.value;


              const position =
                getPosition(
                  item.newRow,
                  item.newCol
                );


              target.element.style.setProperty(
                "--x",
                position.x + "px"
              );


              target.element.style.setProperty(
                "--y",
                position.y + "px"
              );


              target.element.style.transform =
                `translate3d(
                  ${position.x}px,
                  ${position.y}px,
                  0
                )`;


              target.element.classList.add(
                "merge"
              );


              setTimeout(
                function () {

                  target.element.classList.remove(
                    "merge"
                  );

                },
                120
              );

            }

          }


          /*
           * ★移動アニメーション完了後に
           * ★新しいタイルを生成
           *
           * これで「突然左上から2が出る」
           * 問題を防ぐ
           */

          addRandomTile();


          updateScore();


          /*
           * GAME OVER
           */

          if (
            isGameOver()
          ) {

            messageElement.textContent =
              "GAME OVER";


            moveQueue = [];

          }


          moving = false;

          /* アニメーションと新タイル生成が完了した盤面だけ保存 */
          saveCurrentGame();
          updateUndoButton();

          /*
           * 次の入力
           */

          processQueue();


        },

        MOVE_TIME + 10

      );

    }


    /* =========================
       行・列の処理
    ========================= */

    function processLine(
      line,
      direction,
      newBoard,
      movingTiles
    ) {

      let targetIndex = 0;


      for (
        let i = 0;
        i < line.length;
        i++      ) {

        const current =
          line[i];


        /*
         * 同じ数字なら合体
         */

        if (

          i + 1 < line.length &&

          line[i + 1].tile.value ===
            current.tile.value

        ) {

          const next =
            line[i + 1];


          const value =
            current.tile.value * 2;


          const mergedTile = {

            value: value,

            element:
              current.tile.element

          };


          const position =
            getLinePosition(
              direction,
              current.oldRow,
              current.oldCol,
              targetIndex
            );


          newBoard
            [position.row]
            [position.col] =
            mergedTile;


          /*
           * 1個目
           */

          movingTiles.push({

            tile:
              current.tile,

            oldRow:
              current.oldRow,

            oldCol:
              current.oldCol,

            newRow:
              position.row,

            newCol:
              position.col,

            removed: false

          });


          /*
           * 2個目
           */

          movingTiles.push({

            tile:
              next.tile,

            oldRow:
              next.oldRow,

            oldCol:
              next.oldCol,

            newRow:
              position.row,

            newCol:
              position.col,

            removed: true,

            mergedInto:
              mergedTile

          });


          /*
           * スコア加算
           */

          score += value;


          targetIndex++;


          /*
           * 合体したので次を飛ばす
           */

          i += 1;

        }

        else {

          /*
           * 普通の移動
           */

          const position =
            getLinePosition(
              direction,
              current.oldRow,
              current.oldCol,
              targetIndex
            );


          newBoard
            [position.row]
            [position.col] =
            current.tile;


          movingTiles.push({

            tile:
              current.tile,

            oldRow:
              current.oldRow,

            oldCol:
              current.oldCol,

            newRow:
              position.row,

            newCol:
              position.col,

            removed: false

          });


          targetIndex++;

        }

      }

    }


    /* =========================
       移動先
    ========================= */

    function getLinePosition(
      direction,
      oldRow,
      oldCol,
      index
    ) {

      if (
        direction === "left"
      ) {

        return {

          row: oldRow,

          col: index

        };

      }


      if (
        direction === "right"
      ) {

        return {

          row: oldRow,

          col: 3 - index

        };

      }


      if (
        direction === "up"
      ) {

        return {

          row: index,

          col: oldCol

        };

      }


      return {

        row: 3 - index,

        col: oldCol

      };

    }


    /* =========================
       GAME OVER判定
    ========================= */

    function isGameOver() {


      /*
       * 空きマスがある
       */

      for (
        let row = 0;
        row < SIZE;
        row++
      ) {

        for (
          let col = 0;
          col < SIZE;
          col++
        ) {

          if (
            boardData[row][col] ===
            null
          ) {

            return false;

          }

        }

      }


      /*
       * 横に合体できるか
       */

      for (
        let row = 0;
        row < 4;
        row++
      ) {

        for (
          let col = 0;
          col < 3;
          col++
        ) {

          if (

            boardData[row][col].value ===
            boardData[row][col + 1].value

          ) {

            return false;

          }

        }

      }


      /*
       * 縦に合体できるか
       */

      for (
        let row = 0;
        row < 3;
        row++
      ) {

        for (
          let col = 0;
          col < 4;
          col++
        ) {

          if (

            boardData[row][col].value ===
            boardData[row + 1][col].value

          ) {

            return false;

          }

        }

      }


      return true;

    }


    /* =========================
       キーボード
    ========================= */

    document.addEventListener(
      "keydown",
      function (event) {

        const key = event.key;
        if (event.repeat || event.target === secretInput || ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
        const normalizedKey = key.toLowerCase();

        if (key === "ArrowLeft" || normalizedKey === "a") {

          event.preventDefault();

          requestMove("left");

        }

        else if (key === "ArrowRight" || normalizedKey === "d") {

          event.preventDefault();

          requestMove("right");

        }

        else if (key === "ArrowUp" || normalizedKey === "w") {

          event.preventDefault();

          requestMove("up");

        }

        else if (key === "ArrowDown" || normalizedKey === "s") {

          event.preventDefault();

          requestMove("down");

        }

      }
    );


    /* =========================
       新しいゲーム
    ========================= */

    newGameButton.addEventListener("click", function () {
      if (window.confirm("今のゲームを終了して、新しいゲームを始めますか？")) newGame();
    });

    modeSelect.addEventListener("change", function () {
      const nextMode = modeSelect.value === "hardcore" ? "hardcore" : "standard";
      if (nextMode === gameMode) return;
      if (!window.confirm("モードを変更すると、現在のゲームを終了して新しい盤面を開始します。よろしいですか？")) {
        modeSelect.value = gameMode;
        return;
      }
      gameMode = nextMode;
      undoSnapshot = null;
      newGame();
    });

    undoButton.addEventListener("click", function () {
      if (gameMode !== "standard" || !undoSnapshot || moving) return;
      const snapshot = undoSnapshot;
      undoSnapshot = null;
      moveQueue = [];
      deleteMode = false;
      if (restoreSnapshot(snapshot)) {
        saveCurrentGame();
        updateUndoButton();
      }
    });

    themeButton.addEventListener("click", function () {
      darkMode = !darkMode;
      document.body.classList.toggle("dark-mode", darkMode);
      themeButton.textContent = darkMode ? "☀ ライト" : "☾ ダーク";
      themeButton.setAttribute("aria-pressed", String(darkMode));
      try { localStorage.setItem("2048-theme", darkMode ? "dark" : "light"); } catch (error) {}
    });

    try { darkMode = localStorage.getItem("2048-theme") === "dark"; } catch (error) {}
    document.body.classList.toggle("dark-mode", darkMode);
    themeButton.textContent = darkMode ? "☀ ライト" : "☾ ダーク";
    themeButton.setAttribute("aria-pressed", String(darkMode));


    /* =========================
       スワイプ
    ========================= */

    let startX = 0;

    let startY = 0;


    board.addEventListener(
      "touchstart",
      function (event) {

        /*
         * 削除モード中は
         * スワイプしない
         */

        if (deleteMode) {
          return;
        }


        const touch =
          event.touches[0];


        startX =
          touch.clientX;

        startY =
          touch.clientY;

      },
      {
        passive: true
      }
    );


    board.addEventListener(
      "touchend",
      function (event) {

        if (deleteMode) {
          return;
        }


        const touch =
          event.changedTouches[0];


        const dx =
          touch.clientX -
          startX;


        const dy =
          touch.clientY -
          startY;


        /*
         * 小さすぎる動きは無視
         */

        if (

          Math.max(Math.abs(dx), Math.abs(dy)) < 24

        ) {

          return;

        }


        /*
         * 横
         */

        if (

          Math.abs(dx) >
          Math.abs(dy)

        ) {

          requestMove(

            dx > 0
              ? "right"
              : "left"

          );

        }

        /*
         * 縦
         */

        else {

          requestMove(

            dy > 0
              ? "down"
              : "up"

          );

        }

      },
      {
        passive: true
      }
    );


    /* =========================
       リサイズ
    ========================= */

    window.addEventListener(
      "resize",
      function () {

        /*
         * 移動中は触らない
         */

        if (moving) {
          return;
        }


        for (
          let row = 0;
          row < SIZE;
          row++
        ) {

          for (
            let col = 0;
            col < SIZE;
            col++
          ) {

            const tile =
              boardData[row][col];


            if (!tile) {
              continue;
            }


            const position =
              getPosition(
                row,
                col
              );


            /*
             * リサイズ中だけ
             * アニメーションOFF
             */

            tile.element.style.transition =
              "none";


            tile.element.style.transform =
              `translate3d(
                ${position.x}px,
                ${position.y}px,
                0
              )`;

          }

        }


        requestAnimationFrame(
          function () {

            document
              .querySelectorAll(
                ".tile"
              )
              .forEach(
                function (tile) {

                  tile.style.transition =
                    "transform 135ms ease-in-out";

                }
              );

          }
        );

      }
    );


    /* =========================
       初期化
    ========================= */

    bestElement.textContent = best;
    modeSelect.value = gameMode;
    updateUndoButton();


    /* 保存済みゲームがあれば続きから。なければ新規開始 */
    if (!loadCurrentGame()) {
      newGame();
    }

  }

);

</script>

</body>
</html>
